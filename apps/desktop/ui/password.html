<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OmniSearch — Unlock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      gap: 12px;
    }
    #label { font-size: 13px; color: #888; }
    #password-input {
      padding: 12px 16px;
      font-size: 16px;
      background: #16213e;
      border: 2px solid #2e86ab;
      border-radius: 10px;
      color: #fff;
      outline: none;
    }
    #password-input:focus { border-color: #5bc0eb; }
    #error { font-size: 12px; color: #e05c5c; min-height: 16px; }
  </style>
</head>
<body>
  <div id="label">Введи пароль для разблокировки базы:</div>
  <input id="password-input" type="password" placeholder="Пароль..." autofocus />
  <div id="error"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const input = document.getElementById('password-input');
    const error = document.getElementById('error');

    input.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      const password = input.value;
      if (!password) return;

      error.textContent = '';
      input.disabled = true;

      try {
        await invoke('unlock', { password });
      } catch (err) {
        error.textContent = typeof err === 'string' ? err : 'Неверный пароль';
        input.disabled = false;
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
