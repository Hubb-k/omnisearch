name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Fmt, Clippy
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install OpenSSL
        run: choco install openssl --no-progress -y

      - name: Set OpenSSL paths
        run: |
          $opensslDir = (Get-ChildItem "C:\Program Files\" -Filter "OpenSSL*" | Select-Object -First 1).FullName
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib\VC\x64\MD" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Download ONNX Runtime
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort_tmp
          New-Item -ItemType Directory -Force -Path libs/onnxruntime/lib
          Copy-Item ort_tmp/onnxruntime-win-x64-1.20.1/lib/onnxruntime.lib libs/onnxruntime/lib/
          Copy-Item ort_tmp/onnxruntime-win-x64-1.20.1/lib/onnxruntime.dll libs/onnxruntime/lib/
        shell: pwsh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p core_lib -p importer -- -D warnings

      - name: Build core
        run: cargo build -p core_lib

      - name: Build importer
        run: cargo build -p importer